services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingestion:
    build: .
    container_name: rag_ingestion
    env_file:
      -  .env
    environment:
      POSTGRES_HOST: db
      DATA_DIR: /data
    volumes:
      - ../data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata: